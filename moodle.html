      function renderProjetoFinalMoodleHtml(){return cardStart(colors.lightBlue)+'<p style="margin:0 0 8px;color:'+colors.darkBlue+';font-size:12px;font-weight:900;text-transform:uppercase;">Projeto Final</p><h3 style="margin:0;color:'+colors.blue+';font-size:28px;line-height:1.16;font-weight:900;">Solução em Folha de Cálculo</h3><p style="margin:12px 0 0;max-width:820px;font-size:15px;line-height:1.6;">Solução em folha de cálculo, iniciada na TI08, desenvolvida nas TI09 e TI10, revista na TI11 e concluída na TI12 em XLSX e PDF.</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;"><div style="border-left:4px solid '+colors.blue+';background:'+colors.softBlue+';padding:12px;"><strong>Estrutura</strong><br>Folhas organizadas, dados coerentes e identificação clara</div><div style="border-left:4px solid '+colors.blue+';background:'+colors.softBlue+';padding:12px;"><strong>Revisão</strong><br>Revisão entre pares e melhorias justificadas</div><div style="border-left:4px solid '+colors.blue+';background:'+colors.softBlue+';padding:12px;"><strong>Entrega</strong><br>XLSX, PDF, reflexão e ligação testada</div></div>'+cardEnd()}
      function renderProjetoFinalDocumentoHtml(){return '<div style="font-family:Segoe UI,Aptos,Calibri,Arial,sans-serif;color:'+colors.text+';max-width:1100px;margin:0 auto 24px auto;"><div style="background-color:'+colors.white+';border:1px solid '+colors.line+';border-radius:8px;overflow:hidden;margin-bottom:18px;box-shadow:0 10px 24px rgba(33,115,70,.08);"><div style="padding:18px 22px 14px 22px;border-bottom:4px solid '+colors.lightBlue+';"><h3 style="margin:0;color:'+colors.blue+';font-size:24px;font-weight:900;">Projeto Final: Solução em Folha de Cálculo</h3><p style="margin:8px 0 0 0;font-size:14px;line-height:1.5;color:'+colors.muted+';">Enunciado final da UFCD 0778 para desenvolver, rever, concluir e apresentar um ficheiro de folha de cálculo.</p></div><div style="padding:20px 22px;border-top:4px solid '+colors.blue+';"><h4 style="margin:0 0 10px 0;color:'+colors.blue+';font-size:18px;">Objetivo</h4><p style="font-size:14px;line-height:1.6;margin-bottom:18px;">Construir um ficheiro de folha de cálculo único, organizado, tecnicamente consistente, revisto entre pares e entregue em XLSX e PDF.</p><h4 style="margin:0 0 14px 0;color:'+colors.blue+';font-size:18px;">Configuração mínima</h4><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;"><div style="border-left:4px solid '+colors.lightBlue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Tema</strong><br>Solução em Folha de Cálculo</div><div style="border-left:4px solid '+colors.lightBlue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Extensão</strong><br>Folhas organizadas e área de impressão verificada</div><div style="border-left:4px solid '+colors.lightBlue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Entrega</strong><br>XLSX, PDF e ligação de leitura testada</div></div><h4 style="margin:0 0 14px 0;color:'+colors.blue+';font-size:18px;">Requisitos</h4><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px;"><div style="border-left:4px solid '+colors.blue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Estrutura do livro</strong><br>Folha de apresentação, base de dados formatada como tabela e folhas de cálculo, análise e síntese bem identificadas.</div><div style="border-left:4px solid '+colors.blue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Cálculos e controlo</strong><br>Fórmulas, referências, funções, validação de dados e tratamento de erros adequados ao tema.</div><div style="border-left:4px solid '+colors.blue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Análise e apresentação</strong><br>Ordenação, filtros, tabela dinâmica, gráfico dinâmico, segmentação de dados e preparação para impressão.</div><div style="border-left:4px solid '+colors.blue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Conclusão</strong><br>Revisão entre pares, reflexão individual final e apresentação individual até 5 minutos.</div></div><div style="background-color:'+colors.softBlue+';border-left:4px solid '+colors.blue+';padding:16px;border-radius:4px;margin-bottom:18px;"><h4 style="margin:0 0 10px 0;color:'+colors.blue+';font-size:18px;">Entrega no Moodle</h4><ul style="font-size:14px;line-height:1.7;margin:0;padding-left:20px;"><li>Publicar a ligação de leitura para o PDF final, testada sem sessão iniciada.</li><li>Guardar o XLSX final como 2026-MM_Projeto_Final_PrimeiroNome.xlsx.</li><li>Exportar as folhas finais para 2026-MM_Projeto_Final_PrimeiroNome.pdf.</li><li>Registar as principais decisões relativas ao feedback recebido.</li></ul></div><a style="display:block;text-decoration:none;color:inherit;" href="'+moodleLinks.site+'atividades/projeto-final-apresentacao.html"><div style="background-color:'+colors.softBlue+';border-left:4px solid '+colors.lightBlue+';padding:16px;border-radius:4px;cursor:pointer;"><h4 style="margin:0 0 10px 0;color:'+colors.blue+';font-size:18px;">Página de apoio ao Projeto Final</h4><p style="font-size:14px;line-height:1.6;margin:0;color:'+colors.text+';">Abrir a página com os requisitos finais do Projeto Final da UFCD 0778.</p></div></a></div></div></div><div style="width:100%;margin:0 auto;padding:14px;border:1px solid '+colors.line+';border-radius:8px;background:'+colors.white+';box-shadow:0 10px 24px rgba(33,115,70,.08);font-family:Segoe UI,Aptos,Calibri,Arial,sans-serif;"><iframe style="width:100%;min-height:700px;border:0;border-radius:8px;display:block;background:'+colors.white+';" title="Projeto Final - Solução em Folha de Cálculo UFCD 0778" src="'+moodleLinks.site+'atividades/projeto-final-apresentacao.html" allow="camera; microphone; geolocation; display-capture; clipboard-write" allowfullscreen="allowfullscreen" loading="lazy"></iframe></div>'}
      function renderEPortfoliosMoodleHtml(){return cardStart(colors.darkBlue)+'<p style="margin:0 0 8px;color:'+colors.darkBlue+';font-size:12px;font-weight:900;text-transform:uppercase;">A&ccedil;&atilde;o 26109</p><h3 style="margin:0;color:'+colors.blue+';font-size:28px;line-height:1.16;font-weight:900;">E-Portef&oacute;lios da turma</h3><p style="margin:12px 0 0;max-width:820px;font-size:15px;line-height:1.6;">Espa&ccedil;o para publicar as liga&ccedil;&otilde;es finais dos trabalhos/e-portef&oacute;lios dos formandos, quando estiverem dispon&iacute;veis.</p><div style="margin-top:16px;padding:16px;border:1px dashed '+colors.line+';border-radius:8px;background:'+colors.softBlue+';">Substituir este bloco pelos iframes ou liga&ccedil;&otilde;es finais de cada formando/a.</div>'+cardEnd()}
      function renderTgOverviewHtml(){return '<div style="max-width:1100px;margin:0 auto 24px;font-family:Segoe UI,Aptos,Calibri,sans-serif;color:'+colors.text+';"><a style="display:block;color:inherit;text-decoration:none;" href="'+moodleLinks.glossary+'"><div style="position:relative;overflow:hidden;border:1px solid '+colors.line+';border-radius:8px;background:'+colors.white+';box-shadow:0 10px 24px rgba(33,115,70,.08);"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding:28px 30px 34px;"><div><h3 style="margin:0;color:'+colors.blue+';font-size:28px;line-height:1.16;font-weight:900;">Gloss&aacute;rio colaborativo</h3><p style="margin:12px 0 0;max-width:760px;font-size:15px;line-height:1.6;">Construir, em grupo, um gloss&aacute;rio com os principais conceitos trabalhados ao longo da UFCD.</p></div><div style="display:grid;place-items:center;width:64px;min-width:64px;height:64px;border:1px solid '+colors.line+';border-radius:8px;background:'+colors.softBlue+';color:'+colors.darkBlue+';font-size:30px;font-weight:900;">TG</div></div><div style="position:absolute;left:0;right:0;bottom:0;height:7px;background:linear-gradient(90deg,'+colors.blue+','+colors.lightBlue+','+colors.darkBlue+');"></div></div></a><div style="margin-top:14px;padding:18px 20px;border:1px solid '+colors.line+';border-radius:8px;background:'+colors.white+';box-shadow:0 10px 24px rgba(33,115,70,.08);font-size:15px;"><p style="margin:0 0 12px;line-height:1.6;"><strong>Objetivo:</strong> criar uma defini&ccedil;&atilde;o simples e um exemplo pr&aacute;tico para a palavra atribu&iacute;da &agrave; sala.</p><ol style="margin:0;padding-left:42px;line-height:1.65;"><li>Ler a palavra atribu&iacute;da.</li><li>Conversar sobre o seu significado.</li><li>Escrever uma defini&ccedil;&atilde;o simples, com as vossas palavras.</li><li>Dar um exemplo pr&aacute;tico, sempre que poss&iacute;vel.</li><li>Publicar a palavra e a defini&ccedil;&atilde;o no Gloss&aacute;rio do Moodle.</li></ol></div></div>'}
      function renderTgDayHtml(task){return cardStart(colors.lightBlue)+'<p style="margin:0 0 8px;color:'+colors.darkBlue+';font-size:12px;font-weight:900;text-transform:uppercase;">Tarefa de Grupo</p><h3 style="margin:0 0 16px;color:'+colors.blue+';font-size:24px;line-height:1.2;font-weight:900;">'+task.title+'</h3><table style="width:100%;border-collapse:collapse;overflow:hidden;border:1px solid '+colors.line+';border-radius:8px;font-size:15px;"><thead><tr><th style="width:28%;padding:12px;text-align:left;color:#fff;background:'+colors.blue+';">Grupo</th><th style="padding:12px;text-align:left;color:#fff;background:'+colors.blue+';">Palavra / Termo</th></tr></thead><tbody>'+task.words.map(([room,word])=>'<tr><td style="padding:12px;border-top:1px solid '+colors.line+';background:'+colors.softBlue+';font-weight:900;">'+room+'</td><td style="padding:12px;border-top:1px solid '+colors.line+';">'+word+'</td></tr>').join('')+'</tbody></table>'+cardEnd()}
      function renderTiOverviewHtml(){return '<div style="max-width:1100px;margin:0 auto 24px;font-family:Segoe UI,Aptos,Calibri,sans-serif;color:'+colors.text+';"><a style="display:block;color:inherit;text-decoration:none;" href="'+moodleLinks.forum1+'"><div style="position:relative;overflow:hidden;border:1px solid '+colors.line+';border-radius:8px;background:'+colors.white+';box-shadow:0 10px 24px rgba(33,115,70,.08);"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding:28px 30px 34px;"><div><h3 style="margin:0;color:'+colors.blue+';font-size:28px;line-height:1.16;font-weight:900;">F&oacute;rum de atividades</h3><p style="margin:12px 0 0;max-width:760px;font-size:15px;line-height:1.6;">F&oacute;rum dedicado &agrave;s tarefas, organizado por t&oacute;picos tem&aacute;ticos.</p></div><div style="display:grid;place-items:center;width:64px;min-width:64px;height:64px;border:1px solid '+colors.line+';border-radius:8px;background:'+colors.softOrange+';color:'+colors.darkBlue+';font-size:30px;font-weight:900;">TI</div></div><div style="position:absolute;left:0;right:0;bottom:0;height:7px;background:linear-gradient(90deg,'+colors.blue+','+colors.lightBlue+','+colors.darkBlue+');"></div></div></a><div style="margin-top:14px;padding:18px 20px;border:1px solid '+colors.line+';border-radius:8px;background:'+colors.white+';box-shadow:0 10px 24px rgba(33,115,70,.08);font-size:15px;"><p style="margin:0 0 12px;line-height:1.6;">Cada t&oacute;pico corresponde a um tema da UFCD e inclui a respetiva atividade individual.</p><ol style="margin:0;padding-left:42px;line-height:1.65;"><li>L&ecirc; o enunciado com aten&ccedil;&atilde;o antes de come&ccedil;ar.</li><li>Resolve a tarefa de forma aut&oacute;noma.</li><li>Organiza a resposta de forma clara e completa.</li><li>Sempre que fizer sentido, aplica exemplos pr&aacute;ticos relacionados com a forma&ccedil;&atilde;o.</li><li>Rev&ecirc; o trabalho antes de submeter ou publicar a resposta no Moodle.</li></ol></div></div>'}
      function renderTiHtml(task,index){const accent=index<6?colors.lightBlue:colors.darkBlue;const stepsHtml='<p style="margin:0 0 8px;font-weight:900;color:'+colors.darkBlue+';">O que fazer:</p><ul style="margin:0;padding-left:22px;line-height:1.7;">'+task.steps.map(step=>'<li>'+step+'</li>').join('')+'</ul>';const moodleHtml=task.moodleRecord?'<p style="margin:14px 0 0;line-height:1.6;"><strong>Registo no Moodle:</strong> '+task.moodleRecord+'</p>':'';return cardStart(accent)+'<h3 style="margin:0 0 12px;color:'+colors.blue+';font-size:24px;line-height:1.2;font-weight:900;">'+task.title+'</h3><p style="margin:0 0 14px;line-height:1.6;"><strong>Objetivo:</strong> '+task.objective+'</p>'+stepsHtml+moodleHtml+cardEnd()}
      function escapeHtml(value){return value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
      const tiRecords=[
        {code:'TI01',title:'O meu e-portfólio começa aqui',prompt:'No tópico da TI01, escreva uma breve mensagem em que:',items:['Confirme que iniciou o seu e-portfólio.','Indique uma expectativa relativamente à Ação 26109.','Refira uma competência ou conhecimento que gostaria de desenvolver ao longo da formação.']},
        {code:'TI02',title:'Identidade visual do meu percurso',prompt:'No tópico da TI02, indique:',items:['O tema ou estilo visual escolhido.','Uma decisão relativa a cores, tipos de letra ou organização dos conteúdos.','O motivo dessa escolha.'],note:'Se considerar adequado, poderá acrescentar uma captura de ecrã de um dos diapositivos criados.'},
        {code:'TI03',title:'Uma aprendizagem em destaque',prompt:'No tópico da TI03, indique:',items:['Qual a UFCD ou atividade escolhida.','Porque selecionou essa evidência.','Qual a principal aprendizagem ou competência que ela demonstra.']},
        {code:'TI04',title:'Dar movimento à apresentação',prompt:'No tópico da TI04, indique:',items:['Que tipo de animação, transição ou elemento multimédia utilizou.','Onde o aplicou.','De que forma esse elemento melhorou — ou não — a apresentação.']},
        {code:'TI05',title:'Preparar, exportar e partilhar',prompt:'No tópico da TI05, registe:',items:['O formato para o qual exportou a apresentação.','A razão da escolha desse formato.','Uma vantagem e, se identificar alguma, uma limitação dessa forma de divulgação ou partilha.']},
        {code:'TI06',title:'Rever e completar o meu e-portfólio',prompt:'No tópico da TI06, faça um breve balanço da UFCD, indicando:',items:['Uma aprendizagem que considera particularmente útil.','Uma dificuldade que conseguiu ultrapassar.','Uma competência em que considera ter evoluído.','Qual das evidências incluídas no e-portfólio melhor representa o trabalho realizado nesta UFCD e porquê.']},
        {code:'TI FINAL',title:'O meu percurso na Ação 26109',prompt:'No tópico da TI Final, publique uma mensagem de encerramento indicando:',items:['A aprendizagem mais importante que leva desta ação.','A competência em que considera ter evoluído mais.','Uma ferramenta ou conhecimento que prevê continuar a utilizar.','Uma palavra ou pequena frase que represente o percurso na Ação 26109.'],note:'Não é necessário repetir no fórum toda a reflexão já registada no e-portfólio.'}
      ];
      function renderTiRecordHtml(record){return cardStart(colors.lightBlue)+'<p style="margin:0 0 8px;color:'+colors.darkBlue+';font-size:12px;font-weight:900;text-transform:uppercase;">Registo no Fórum das Tarefas Individuais</p><h3 style="margin:0 0 12px;color:'+colors.blue+';font-size:24px;line-height:1.2;font-weight:900;">'+escapeHtml(record.code+' — '+record.title)+'</h3><p style="margin:0 0 12px;line-height:1.6;">'+escapeHtml(record.prompt)+'</p><ul style="margin:0;padding-left:22px;line-height:1.7;">'+record.items.map(item=>'<li>'+escapeHtml(item)+'</li>').join('')+'</ul>'+(record.note?'<p style="margin:14px 0 0;line-height:1.6;">'+escapeHtml(record.note)+'</p>':'')+cardEnd()}
      const templates=[{title:'P&aacute;gina de apoio - cart&atilde;o da sec&ccedil;&atilde;o',description:'Cart&atilde;o para abrir a p&aacute;gina de apoio da UFCD no Moodle.',html:renderPageCardHtml()},{title:'P&aacute;gina de apoio - conte&uacute;do da p&aacute;gina',description:'Iframe para colocar dentro da p&aacute;gina Moodle.',html:renderPageIframeHtml()},{title:'Brainstorming - Mentimeter incorporado',description:'Iframe do Mentimeter fornecido.',html:renderMentimeterHtml()},{title:'TG - Gloss&aacute;rio colaborativo',description:'Bloco geral para a tarefa de grupo no Gloss&aacute;rio Moodle.',html:renderTgOverviewHtml()},{title:'TI - F&oacute;rum de tarefas individuais',description:'Bloco geral para apresentar o f&oacute;rum das tarefas individuais.',html:renderTiOverviewHtml()},...tiRecords.map(record=>({title:record.code+' - '+record.title,description:'Registo a publicar no tópico da '+record.code+' do Fórum das Tarefas Individuais.',html:renderTiRecordHtml(record)}))].map(template=>({...template,html:template.html.replaceAll('rgba(33,115,70,.08)','rgba(210,71,38,.08)')}));
      function renderTemplates(){const root=document.getElementById('templates');root.innerHTML=templates.map((template,index)=>'<article class="template-card"><div class="template-head"><div><h2>'+(index+1)+'. '+template.title+'</h2><p>'+template.description+'</p></div><button class="copy-button" type="button" data-copy="'+index+'">Copiar HTML</button></div><div class="template-body"><div class="preview" aria-label="Pr&eacute;-visualiza&ccedil;&atilde;o">'+template.html+'</div><div class="code-panel"><textarea spellcheck="false" aria-label="C&oacute;digo HTML do modelo '+template.title+'">'+escapeHtml(template.html)+'</textarea></div></div></article>').join('')}
      async function copyTemplate(index,button){const html=templates[index].html;try{await navigator.clipboard.writeText(html);button.textContent='Copiado';setTimeout(()=>{button.textContent='Copiar HTML'},1600)}catch(error){const textarea=button.closest('.template-card').querySelector('textarea');textarea.focus();textarea.select();button.textContent='Selecionado'}}
      renderTemplates();document.addEventListener('click',event=>{const button=event.target.closest('[data-copy]');if(!button)return;copyTemplate(Number(button.dataset.copy),button)});
    </script>
