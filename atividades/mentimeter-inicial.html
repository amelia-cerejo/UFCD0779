    <script>
      (() => {
        const presentationUrl = window.UFCD0778_PENDING_LINKS.mentimeterEmbedUrl;
        const participationUrl = window.UFCD0778_PENDING_LINKS.mentimeterUrl;

        function corrigirIdentificacao0778(elemento) {
          const walker = document.createTreeWalker(elemento, NodeFilter.SHOW_TEXT);
          const textos = [];

          while (walker.nextNode()) textos.push(walker.currentNode);

          textos.forEach((texto) => {
            texto.nodeValue = texto.nodeValue
              .replace(/Processador de Texto/gi, "Folha de Cálculo")
              .replace(/Microsoft Word/gi, "Microsoft Excel")
              .replace(/\bWord\b/gi, "Excel")
              .replace(/\b0754\b/g, "0778");
          });
        }

        function atualizarMentimeter0778() {
          corrigirIdentificacao0778(document.body);

          const frame = document.querySelector(".mentimeter-frame");
          if (frame && frame.getAttribute("src") !== presentationUrl) {
            frame.setAttribute("src", presentationUrl);
          }

          document.querySelectorAll(".mentimeter-embed-block a").forEach((link) => {
            const label = link.textContent.trim();
            if (label === "Abrir apresentação") {
              link.setAttribute("href", presentationUrl);
            }
            if (label === "Participar" || label === "Abrir ligação de participação") {
              link.setAttribute("href", participationUrl);
            }
          });

        }

        atualizarMentimeter0778();

        const root = document.getElementById("activity-root");
        if (root) {
          new MutationObserver(atualizarMentimeter0778).observe(root, {
            childList: true,
            subtree: true
          });
        }
      })();
    </script>
